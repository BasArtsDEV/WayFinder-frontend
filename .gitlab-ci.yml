cache:
    key: "${CI_COMMIT_REF_SLUG}-node"
    paths:
        - node_modules/

stages:
    - test

test:
    stage: test
    image: node:lts
    script:
        # Installation des dépendances
        - npm ci

        # Qualité du code (JS/TS et CSS)
        - npm run lint
        - npm run lint:css

        # Build de l'application (vérifie aussi les types TypeScript avec tsc -b)
        - npm run build
    tags:
        - node
        - npm